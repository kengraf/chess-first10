<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: sans-serif; padding: 2rem; }
        button { margin: 0.5rem; padding: 0.5rem 1.5rem; cursor: pointer; }
        #status { margin-top: 1rem; padding: 1rem; background: #f0f0f0; white-space: pre; }
    </style>
</head>
<body>

    <button onclick="login()">Login</button>
    <button onclick="refreshToken()">Refresh Token</button>
    <button onclick="checkToken()">Check Token</button>
    <button onclick="logout()">Logout</button>

    <div id="status">Not logged in</div>

    <script src="auth.js"></script>
    <script>
        function log(msg) {
            document.getElementById('status').textContent =
                JSON.stringify(msg, null, 2);
        }

        async function checkToken() {
            if (!window._auth) return log('No token');
            const secondsLeft = Math.floor((window._auth.expires_at - Date.now()) / 1000);
            log({
                access_token: window._auth.access_token.substring(0, 20) + '...',
                expires_in:   `${Math.floor(secondsLeft / 60)}m ${secondsLeft % 60}s`,
                expired:      isTokenExpired()
            });
        }

        // override onLoginSuccess from auth.js
        function onLoginSuccess(data) {
            log({ status: 'Logged in', email: data.email, picture: data.picture });
        }
    </script>

</body>
</html>
